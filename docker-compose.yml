services:
  fastapi:
    build: .
    working_dir: /app/src
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    volumes:
      - ./:/app
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - PYTHONPATH=/app/src

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
